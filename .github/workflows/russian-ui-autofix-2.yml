name: Russian UI autofix 2

on:
  push:
    branches:
      - fix/full-russian-ui

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Translate remaining catalog and UI text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            '"${categoryTools.size} tools"': '"${categoryTools.size} инструментов"',
            'text = category,': 'text = categoryLabel(category),',
            '"Screen Control"': '"Управление экраном"', '"Device"': '"Устройство"', '"Files"': '"Файлы"', '"Camera"': '"Камера"', '"Communication"': '"Связь"', '"Notifications"': '"Уведомления"', '"Media"': '"Мультимедиа"', '"Storage"': '"Хранилище"', '"Apps"': '"Приложения"', '"System"': '"Система"', '"Overlays"': '"Наложения"', '"Alarms"': '"Будильники"', '"Other"': '"Другое"',
            '"Active"': '"Активен"', '"Last used"': '"Последний использованный"', '"Available Tools"': '"Доступные инструменты"', '"Collapse"': '"Свернуть"', '"Expand"': '"Развернуть"',
            '"Observe Screen"':'"Наблюдать за экраном"','"Indexed actionable-element view of the current screen with stable refs; " +':'"Индексированное представление элементов текущего экрана со стабильными ссылками; " +','"falls back to on-device OCR when the accessibility tree is sparse"':'"при разреженном дереве специальных возможностей используется OCR на устройстве"','"Screen Hierarchy"':'"Иерархия экрана"','"Read the UI accessibility tree"':'"Читать дерево специальных возможностей интерфейса"','"Screenshot"':'"Снимок экрана"','"Capture screen as JPEG; optional annotate adds numbered boxes (Set-of-Marks)"':'"Сохранить экран как JPEG; при необходимости добавить нумерованные области"','"Gesture"':'"Жест"','"Tap, swipe, or long-press on screen"':'"Нажатие, свайп или долгое нажатие на экране"','"Type Text"':'"Ввести текст"','"Type text into focused input field"':'"Ввести текст в активное поле"','"Find Element"':'"Найти элемент"','"Search for UI elements by text"':'"Искать элементы интерфейса по тексту"','"Click by Text"':'"Нажать по тексту"','"Find and tap element by visible text"':'"Найти и нажать элемент по видимому тексту"','"Click by ID"':'"Нажать по ID"','"Find and tap element by view ID"':'"Найти и нажать элемент по ID представления"','"Scroll"':'"Прокрутка"','"Scroll in any direction"':'"Прокрутка в любом направлении"','"Tap"':'"Нажатие"','"Tap an element by ref or coordinates"':'"Нажать элемент по ссылке или координатам"','"Long Press"':'"Долгое нажатие"','"Long-press an element by ref or coordinates"':'"Долго нажать элемент по ссылке или координатам"','"Set Text"':'"Установить текст"','"Type text into a specific field by ref (replace or append)"':'"Ввести текст в поле по ссылке (заменить или добавить)"','"Set Toggle"':'"Установить переключатель"','"Set a switch or checkbox on/off by ref"':'"Включить или выключить переключатель или флажок по ссылке"','"Perform Action"':'"Выполнить действие"','"Invoke an accessibility action on an element by ref"':'"Выполнить действие специальных возможностей над элементом по ссылке"','"Press Key"':'"Нажать клавишу"','"Press a hardware/IME key (Enter, Back, Tab, arrows…)"':'"Нажать аппаратную или IME-клавишу (Enter, Назад, Tab, стрелки…)"','"Wait for Idle"':'"Ждать бездействия"','"Wait until the screen stops changing"':'"Ждать, пока экран перестанет изменяться"','"Wait for Element"':'"Ждать элемент"','"Wait until an element appears or disappears"':'"Ждать появления или исчезновения элемента"','"System Action"':'"Системное действие"','"Home, back, recents, and other system actions"':'"Главный экран, назад, последние приложения и другие системные действия"',
            '"Device Info"':'"Сведения об устройстве"','"Model, OS, RAM, storage, and hardware details"':'"Модель, ОС, ОЗУ, хранилище и сведения об оборудовании"','"Battery"':'"Батарея"','"Battery level, charging status, and health"':'"Уровень батареи, зарядка и состояние аккумулятора"','"Location"':'"Местоположение"','"Current GPS coordinates and location data"':'"Текущие координаты GPS и данные о местоположении"',
            '"List Files"':'"Список файлов"','"Browse files and folders with metadata"':'"Просматривать файлы и папки с метаданными"','"Read File"':'"Прочитать файл"','"Read text or binary file contents"':'"Читать текстовое или двоичное содержимое файла"','"Write File"':'"Записать файл"','"Create or overwrite files on device"':'"Создавать или перезаписывать файлы на устройстве"','"Delete File"':'"Удалить файл"','"Delete files or directories"':'"Удалять файлы и каталоги"','"Read Host File"':'"Прочитать файл хоста"','"Read a file from an owner-approved folder (App Builder host-dir)"':'"Читать файл из папки, разрешённой разработчиком"','"List Host Folder"':'"Список папки хоста"','"List a folder the owner approved for an app (App Builder host-dir)"':'"Просматривать папку, разрешённую разработчиком для приложения"',
            '"Take Photo"':'"Сделать фото"','"Capture photo from front or back camera"':'"Сделать фото передней или задней камерой"','"Record Video"':'"Записать видео"','"Record short video clip from camera"':'"Записать короткое видео камерой"',
            '"Send SMS"':'"Отправить SMS"','"Send text messages"':'"Отправлять текстовые сообщения"','"Read SMS"':'"Прочитать SMS"','"Read inbox, sent, or all messages"':'"Читать входящие, отправленные или все сообщения"','"Count SMS"':'"Посчитать SMS"','"Count messages in a date window"':'"Считать сообщения за выбранный период"','"Phone Call"':'"Телефонный звонок"','"Initiate a phone call"':'"Начать телефонный звонок"','"Call & Speak"':'"Позвонить и сказать"','"Call and speak text when answered"':'"Позвонить и произнести текст после ответа"','"Search Contacts"':'"Найти контакты"','"Find contacts by name or phone number"':'"Найти контакты по имени или номеру телефона"',
            '"Read"':'"Прочитать"','"Get active and recent notifications"':'"Получить активные и недавние уведомления"','"Post"':'"Показать"','"Show a local notification"':'"Показать локальное уведомление"','"Dismiss"':'"Закрыть"','"Dismiss a specific notification"':'"Скрыть выбранное уведомление"','"Dismiss All"':'"Закрыть все"','"Clear all active notifications"':'"Очистить все активные уведомления"',
            '"Play Audio"':'"Воспроизвести аудио"','"Play audio from URL, file, or data"':'"Воспроизвести аудио из URL, файла или данных"','"Stop Audio"':'"Остановить аудио"','"Stop current audio playback"':'"Остановить текущее воспроизведение"','"Text-to-Speech"':'"Синтез речи"','"Speak text aloud using TTS engine"':'"Произнести текст вслух через движок TTS"','"Vibrate"':'"Вибрация"','"Vibrate with custom patterns"':'"Вибрировать по заданному шаблону"','"Now Playing"':'"Сейчас играет"','"Read the currently-playing track (title, artist, source app) from the OS " +':'"Получить текущий трек (название, исполнитель, приложение-источник) из ОС " +','"media sessions; reuses notification access, no extra permission"':'"медиасессий; используется доступ к уведомлениям без дополнительного разрешения"',
            '"Analyze"':'"Анализировать"','"Disk usage breakdown by directory and type"':'"Разбивка использования диска по каталогам и типам"','"Large Files"':'"Большие файлы"','"Find files above a size threshold"':'"Найти файлы больше заданного размера"','"Index Media"':'"Индексировать медиа"','"Index photos/videos with EXIF and GPS"':'"Индексировать фото и видео с EXIF и GPS"','"Search Media"':'"Поиск медиа"','"Search by date, location, type, or camera"':'"Искать по дате, местоположению, типу или камере"',
            '"Installed Apps"':'"Установленные приложения"','"List all apps with version info"':'"Показать все приложения и версии"','"Launch App"':'"Запустить приложение"','"Launch apps or custom Android intents"':'"Запускать приложения или пользовательские Android Intent"',
            '"Sync App Policy"':'"Синхронизировать политику приложения"','"Receive the owner\'s per-app screen-control allow/deny list from OpenAlly"':'"Получать список разрешений и запретов управления экраном по приложениям"','"Shell Command"':'"Команда оболочки"','"Run commands in app sandbox"':'"Выполнять команды в песочнице приложения"','"Get Clipboard"':'"Получить буфер обмена"','"Read current clipboard content"':'"Читать текущее содержимое буфера обмена"','"Set Clipboard"':'"Установить буфер обмена"','"Copy text to clipboard"':'"Копировать текст в буфер обмена"','"Get Volume"':'"Получить громкость"','"Volume levels for all audio streams"':'"Уровни громкости всех аудиопотоков"','"Set Volume"':'"Установить громкость"','"Adjust volume or mute audio streams"':'"Изменять громкость или отключать звук"','"Toast Message"':'"Всплывающее сообщение"','"Show a brief on-screen message"':'"Показать короткое сообщение на экране"',
            '"Show Overlay"':'"Показать наложение"','"Display floating HTML overlay on screen"':'"Показать плавающее HTML-окно поверх экрана"','"Hide Overlay"':'"Скрыть наложение"','"Hide a specific floating overlay"':'"Скрыть выбранное плавающее окно"','"Hide All"':'"Скрыть все"','"Remove all active overlays"':'"Убрать все активные наложения"','"List Overlays"':'"Список наложений"','"List active overlay IDs"':'"Показать ID активных наложений"','"Companion Face Status"':'"Состояние лица помощника"','"Whether Aster can draw over other apps, and whether OpenAlly\'s companion face is up"':'"Можно ли отображать лицо поверх других приложений и запущено ли лицо помощника"','"Show Companion Face"':'"Показать лицо помощника"','"Draw OpenAlly\'s ambient companion face beside the camera cutout"':'"Показать лицо помощника рядом с вырезом камеры"','"Hide Companion Face"':'"Скрыть лицо помощника"','"Take down OpenAlly\'s ambient companion face"':'"Скрыть лицо помощника"','"Re-place Companion Face"':'"Переместить лицо помощника"','"Recompute the companion face\'s position around the camera cutout"':'"Заново рассчитать положение лица помощника вокруг выреза камеры"',
            '"Get Alarms"':'"Получить будильники"','"View scheduled alarms"':'"Просмотреть запланированные будильники"','"Set Alarm"':'"Установить будильник"','"Create a new alarm"':'"Создать новый будильник"','"Dismiss Alarm"':'"Остановить будильник"','"Stop a ringing alarm"':'"Остановить звонящий будильник"','"Delete Alarm"':'"Удалить будильник"','"Remove a saved alarm"':'"Удалить сохранённый будильник"',
          }
          files = list(Path('apps/android/app/src/main/java/com/aster/ui').rglob('*.kt')) + [Path('apps/android/app/src/main/java/com/aster/service/mode/ToolCatalog.kt')]
          changed=[]
          for p in files:
            s=p.read_text(encoding='utf-8'); old=s
            for a,b in replacements.items(): s=s.replace(a,b)
            if p.name=='ToolsSection.kt' and 'private fun categoryLabel' not in s:
              marker='// =============================================================================\n// TOOL ROW\n// ============================================================================='
              helper='''private fun categoryLabel(category: String): String = when (category) {\n    "Screen Control" -> "Управление экраном"\n    "Device" -> "Устройство"\n    "Files" -> "Файлы"\n    "Camera" -> "Камера"\n    "Communication" -> "Связь"\n    "Notifications" -> "Уведомления"\n    "Media" -> "Мультимедиа"\n    "Storage" -> "Хранилище"\n    "Apps" -> "Приложения"\n    "System" -> "Система"\n    "Overlays" -> "Наложения"\n    "Alarms" -> "Будильники"\n    else -> "Другое"\n}\n\n'''
              s=s.replace(marker, helper+marker)
            if s!=old:
              p.write_text(s,encoding='utf-8'); changed.append(str(p))
          print('\n'.join(changed))
          PY
          rm -f .github/workflows/russian-ui-autofix-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/app/src/main/java/com/aster/ui apps/android/app/src/main/java/com/aster/service/mode/ToolCatalog.kt .github/workflows/russian-ui-autofix-2.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: localize tool catalog and remaining UI text'
          git push
