name: Russian UI autofix

on:
  push:
    branches:
      - fix/full-russian-ui

permissions:
  contents: write

jobs:
  translate-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Translate remaining user-facing English strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('apps/android/app/src/main/java/com/aster/ui')]
          replacements = {
              '"Active"': '"Активен"',
              '"Last used"': '"Последний использованный"',
              '"Available Tools"': '"Доступные инструменты"',
              '"Collapse"': '"Свернуть"',
              '"Expand"': '"Развернуть"',
              '"tools"': '"инструментов"',
              '"Screen Control"': '"Управление экраном"',
              '"Device"': '"Устройство"',
              '"Files"': '"Файлы"',
              '"Communication"': '"Связь"',
              '"Notifications"': '"Уведомления"',
              '"Media"': '"Мультимедиа"',
              '"Storage"': '"Хранилище"',
              '"Apps"': '"Приложения"',
              '"System"': '"Система"',
              '"Overlays"': '"Наложения"',
              '"Alarms"': '"Будильники"',
              '"wants to connect via IPC"': '"запрашивает подключение через IPC"',
              '"This will allow the app to use Aster Tools on this device, including device control, file access, and other capabilities."': '"Это позволит приложению использовать инструменты Светланы на этом устройстве, включая управление устройством, доступ к файлам и другие возможности."',
              '"Approve"': '"Разрешить"',
              '"Deny"': '"Отклонить"',
              '"Permissions Required"': '"Требуются разрешения"',
              '"Aster Tools needs these permissions to provide full device control capabilities."': '"Для полного управления устройством инструментам Светланы нужны эти разрешения."',
              '"RUNTIME"': '"ОСНОВНЫЕ"',
              '"Notifications"': '"Уведомления"',
              '"Post and manage notifications"': '"Показывать и управлять уведомлениями"',
              '"Location"': '"Местоположение"',
              '"Access GPS and network location"': '"Доступ к GPS и сетевому местоположению"',
              '"Phone & SMS"': '"Телефон и SMS"',
              '"Read/send SMS and make calls"': '"Читать и отправлять SMS, совершать звонки"',
              '"Contacts"': '"Контакты"',
              '"Search and read device contacts"': '"Поиск и чтение контактов устройства"',
              '"Camera"': '"Камера"',
              '"Capture photos and video"': '"Снимать фото и видео"',
              '"SPECIAL ACCESS"': '"СПЕЦИАЛЬНЫЙ ДОСТУП"',
              '"All Files Access"': '"Доступ ко всем файлам"',
              '"Full file system read/write access"': '"Полный доступ к чтению и записи файлов"',
              '"Accessibility Service"': '"Служба специальных возможностей"',
              '"Screen control, gestures, and UI automation"': '"Управление экраном, жесты и автоматизация интерфейса"',
              '"Notification Listener"': '"Доступ к уведомлениям"',
              '"Read and intercept incoming notifications"': '"Чтение и обработка входящих уведомлений"',
              '"Display Over Apps"': '"Отображение поверх других приложений"',
              '"Show system overlay windows"': '"Показывать системные окна поверх приложений"',
              '"Battery Optimization"': '"Оптимизация батареи"',
              '"Prevent service interruption"': '"Предотвращать остановку службы"',
              '"Continue in Settings…"': '"Продолжить в настройках…"',
              '"Ask all together"': '"Запросить всё сразу"',
              '"Continue"': '"Продолжить"',
              '"Grant All Permissions First"': '"Сначала предоставьте все разрешения"',
              '"Back"': '"Назад"',
              '"Grant"': '"Разрешить"',
              '"Unknown App"': '"Неизвестное приложение"',
              '"Choose a draft to publish"': '"Выберите вариант для публикации"',
              '"OPTION ${i + 1}"': '"ВАРИАНТ ${i + 1}"',
              '"Use this  ›"': '"Использовать этот  ›"',
              '"Tap a draft to edit"': '"Нажмите на вариант, чтобы изменить его"',
              '"Pick a draft"': '"Выберите вариант"',
              '"Reject"': '"Отклонить"',
          }

          changed = []
          for root in roots:
              for path in root.rglob('*.kt'):
                  text = path.read_text(encoding='utf-8')
                  original = text
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))

          print('Changed files:')
          for p in changed:
              print(p)
          PY

      - name: Remove temporary workflow after translation
        shell: bash
        run: |
          rm -f .github/workflows/russian-ui-autofix.yml

      - name: Commit Russian UI changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/app/src/main/java/com/aster/ui .github/workflows/russian-ui-autofix.yml
          if git diff --cached --quiet; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git commit -m 'fix: translate remaining user-facing Aster UI to Russian'
          git push
