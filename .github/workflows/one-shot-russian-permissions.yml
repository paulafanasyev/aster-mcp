name: One-shot Russian permissions maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  localize:
    if: startsWith(github.event.head_commit.message, 'chore: run russian permissions maintenance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localize permission UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'PermissionsScreen.kt': {
              '"Permissions"': '"Разрешения"',
              '"All Granted"': '"Все предоставлены"',
              '"Continue in Settings…"': '"Продолжить в настройках…"',
              '"Ask all together"': '"Запросить все вместе"',
              '"Step $step of ${guidedFlow.stepsTotal} — $label"': '"Шаг $step из ${guidedFlow.stepsTotal} — $label"',
              '"Grant everything in one guided flow instead of tapping each row."': '"Пройдите все разрешения в одном пошаговом режиме вместо открытия каждой строки."',
              '"All permissions granted"': '"Все разрешения предоставлены"',
              '"Permissions granted"': '"Предоставленные разрешения"',
              '"Runtime Permissions"': '"Основные разрешения"',
              '"Notifications"': '"Уведомления"',
              '"Post and manage notifications"': '"Показывать и управлять уведомлениями"',
              '"Location"': '"Местоположение"',
              '"Access GPS and network location"': '"Доступ к GPS и местоположению по сети"',
              '"Phone & SMS"': '"Телефон и SMS"',
              '"Read/send SMS and make calls"': '"Читать и отправлять SMS, совершать звонки"',
              '"Contacts"': '"Контакты"',
              '"Search and read device contacts"': '"Поиск и чтение контактов устройства"',
              '"Camera"': '"Камера"',
              '"Capture photos and video"': '"Съёмка фото и видео"',
              '"Special Access"': '"Специальный доступ"',
              '"All Files Access"': '"Доступ ко всем файлам"',
              '"Storage"': '"Хранилище"',
              '"Full file system read/write access"': '"Полный доступ к чтению и записи файлов"',
              '"Accessibility Service"': '"Служба специальных возможностей"',
              '"Screen control, gestures, and UI automation"': '"Управление экраном, жестами и автоматизацией интерфейса"',
              '"Notification Listener"': '"Доступ к уведомлениям"',
              '"Read and intercept incoming notifications"': '"Чтение и обработка входящих уведомлений"',
              '"Display Over Apps"': '"Отображение поверх других приложений"',
              '"Show system overlay windows"': '"Показывать окна поверх других приложений"',
              '"Battery Optimization"': '"Оптимизация батареи"',
              '"Exempt from battery optimization to prevent service interruption"': '"Исключить приложение из оптимизации батареи, чтобы служба не прерывалась"',
              '"Tap each permission to grant access, or use “Ask all together” below to walk through everything in one go. Some permissions require manual enabling in system settings and cannot be requested directly."': '"Нажмите на разрешение, чтобы предоставить доступ, или используйте кнопку «Запросить все вместе» ниже. Некоторые разрешения нужно включить вручную в системных настройках."',
            },
            'InteractivePromptActivity.kt': {
              '"Choose a draft to publish"': '"Выберите вариант для публикации"',
              '"OPTION ${i + 1}"': '"ВАРИАНТ ${i + 1}"',
              '"${(if (prompt.editable) edited[i] else variant.text).length} chars"': '"${(if (prompt.editable) edited[i] else variant.text).length} символов"',
              '"Use this  ›"': '"Использовать ›"',
              '"Tap a draft to edit"': '"Нажмите на вариант, чтобы изменить его"',
              '"Pick a draft"': '"Выберите вариант"',
              '"Reject"': '"Отклонить"',
            },
          }
          root = Path('apps/android/app/src/main/java/com/aster')
          for filename, mapping in replacements.items():
              matches = list(root.rglob(filename))
              if not matches:
                  raise SystemExit(f'File not found: {filename}')
              p = matches[0]
              text = p.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'Expected text missing in {p}: {old}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Verify no English permission labels remain
        shell: bash
        run: |
          ! grep -nE '"(Permissions|All Granted|Continue in Settings|Ask all together|Runtime Permissions|Notifications|Location|Phone & SMS|Contacts|Camera|Special Access|All Files Access|Storage|Accessibility Service|Notification Listener|Display Over Apps|Battery Optimization|Reject|Use this)' apps/android/app/src/main/java/com/aster/ui/screens/permissions/PermissionsScreen.kt
          ! grep -nE '"(Choose a draft to publish|OPTION | chars|Use this|Tap a draft to edit|Pick a draft|Reject)' apps/android/app/src/main/java/com/aster/ui/InteractivePromptActivity.kt
          git diff --check

      - name: Commit localization
        shell: bash
        run: |
          git config user.name 'Svetlana CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/app/src/main/java/com/aster/ui/screens/permissions/PermissionsScreen.kt apps/android/app/src/main/java/com/aster/ui/InteractivePromptActivity.kt
          git diff --cached --stat
          git commit -m 'fix: fully localize permission prompts in Russian'
          git push
