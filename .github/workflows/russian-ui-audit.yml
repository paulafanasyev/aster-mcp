name: Russian UI audit
on:
  push:
    branches: [fix/full-russian-ui]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find likely English user-facing strings
        shell: bash
        run: |
          set +e
          grep -RInE '"[^"\\]*(Active|Last used|Available Tools|Collapse|Expand|tools|Approve|Deny|Permissions Required|RUNTIME|SPECIAL ACCESS|Notifications|Location|Phone & SMS|Contacts|Camera|Storage|Accessibility Service|Notification Listener|Display Over Apps|Battery Optimization|Continue in Settings|Ask all together|Grant All Permissions|Choose a draft|OPTION|chars|Use this|Tap a draft|Pick a draft|Reject|Step [0-9]|Unknown App|Unknown|Connected|Disconnected|Connect|Disconnect|Server|Settings|Permission|Required|Error|Success|Failed|Cancel|Save|Delete|Close|Open|Start|Stop|Other|Screen Control|Device|Files|Communication|Media|Apps|System|Overlays|Alarms)"' apps/android/app/src/main/java/com/aster/ui apps/android/app/src/main/java/com/aster/service/mode/ToolCatalog.kt > /tmp/english.txt
          cat /tmp/english.txt
          if [ -s /tmp/english.txt ]; then exit 1; fi
          echo RUSSIAN_UI_AUDIT_PASS
