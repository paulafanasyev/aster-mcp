name: Aster Emulator Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare emulator-compatible debug build
        working-directory: apps/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('        ndk {\n            abiFilters += "arm64-v8a"\n        }\n', '')
          p.write_text(s)
          PY
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Boot Android emulator and run smoke audit
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.aster || true
            adb shell monkey -p com.aster 1
            sleep 8
            echo '--- PACKAGE ---'
            adb shell dumpsys package com.aster | head -n 40
            echo '--- UI DUMP ---'
            adb exec-out uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml | head -c 20000
            echo
            echo '--- CRASH CHECK ---'
            if adb logcat -d -t 400 | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.aster' ; then
              echo 'CRASH_DETECTED'
              exit 1
            fi
            echo 'EMULATOR_AUDIT_PASS'
