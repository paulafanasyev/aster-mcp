name: Russian UI autofix 3
on:
  push:
    branches: [fix/full-russian-ui]
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Finish Russian UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          repl={
            '"Remote Server"':'"Удалённый сервер"','"Grant all permissions before connecting"':'"Перед подключением предоставьте все необходимые разрешения"','"Cancel"':'"Отмена"','"Connect"':'"Подключить"','"Connection failed. Check the server URL and ensure the aster-mcp server is running."':'"Не удалось подключиться. Проверьте адрес сервера и убедитесь, что aster-mcp запущен."','"Connection rejected. Approve this device from the Aster dashboard (localhost:5989)."':'"Подключение отклонено. Разрешите это устройство в панели Aster (localhost:5989)."','"Awaiting Approval..."':'"Ожидание подтверждения…"','"Open the Aster dashboard at localhost:5989 (or your server address) and approve this device."':'"Откройте панель Aster по адресу localhost:5989 (или адресу вашего сервера) и разрешите это устройство."','"Reconnecting..."':'"Повторное подключение…"','"Connecting..."':'"Подключение…"','"Restoring WebSocket connection"':'"Восстановление WebSocket-соединения"','"Establishing WebSocket connection"':'"Установка WebSocket-соединения"','"Server Address"':'"Адрес сервера"','"Enter the WebSocket URL of your running aster-mcp server. Default port is 5987."':'"Введите WebSocket-адрес запущенного сервера aster-mcp. Порт по умолчанию — 5987."','"Server URL"':'"Адрес сервера"','"Encrypted"':'"Зашифровано"','"LAN / Tailscale"':'"LAN / Tailscale"','"Setup Guide"':'"Инструкция по настройке"','"Step 1"':'"Шаг 1"','"Install via NPM"':'"Установка через NPM"','"Install the aster-mcp server globally on your computer:"':'"Установите сервер aster-mcp глобально на компьютере:"','"Start the server:"':'"Запустите сервер:"','"The server starts on 3 ports:"':'"Сервер запускается на 3 портах:"','"WebSocket"':'"WebSocket"','"Device connection"':'"Подключение устройства"','"MCP HTTP"':'"MCP HTTP"','"AI client endpoint"':'"Точка подключения ИИ-клиента"','"Dashboard"':'"Панель управления"','"Web UI for management"':'"Веб-интерфейс управления"','"Enter ws://<your-ip>:5987 in the Server Address above and tap Connect"':'"Введите ws://<ваш-ip>:5987 в поле «Адрес сервера» выше и нажмите «Подключить»"','"Approve the device from the Aster dashboard at localhost:5989"':'"Разрешите устройство в панели Aster по адресу localhost:5989"','"MCP Client Config"':'"Настройка MCP-клиента"','"Add this to your Claude Desktop / Cursor .mcp.json:"':'"Добавьте это в .mcp.json Claude Desktop / Cursor:"','"Skill"':'"Навык"','"Aster is available as a skill on ClawHub for OpenClaw, MoltBot, and ClawBot. Install it directly:"':'"Aster доступен как навык ClawHub для OpenClaw, MoltBot и ClawBot. Установите его напрямую:"','"Or browse at clawhub.com/skills/aster"':'"Или откройте clawhub.com/skills/aster"','"Once installed, the aster-mcp server runs automatically within OpenClaw. Just connect this device to the server and the AI can use all 40+ tools."':'"После установки сервер aster-mcp автоматически запускается в OpenClaw. Подключите это устройство к серверу, и ИИ получит доступ ко всем 40+ инструментам."','"About"':'"О приложении"','"What is Remote Server?"':'"Что такое удалённый сервер?"','"The aster-mcp NPM package runs a gateway server on your computer. " +':'"Пакет aster-mcp для NPM запускает сервер-шлюз на вашем компьютере. " +','"This device connects to it via WebSocket (port 5987), while your AI clients " +':'"Это устройство подключается к нему через WebSocket (порт 5987), а ваши ИИ-клиенты " +','"(Claude Desktop, Cursor, etc.) connect via the MCP HTTP endpoint (port 5988). " +':'"(Claude Desktop, Cursor и другие) подключаются через MCP HTTP (порт 5988). " +','"The server bridges the two, giving your AI 40+ tools to control this Android device."':'"Сервер соединяет их и предоставляет ИИ 40+ инструментов для управления этим Android-устройством."','"Tailscale Recommended"':'"Рекомендуется Tailscale"','"For remote access without port forwarding, install Tailscale on both your server and this device. " +':'"Для удалённого доступа без проброса портов установите Tailscale на сервере и этом устройстве. " +','"Aster auto-detects Tailscale IPs. Use ws://<tailscale-ip>:5987 for a secure, encrypted connection from anywhere."':'"Aster автоматически обнаруживает IP Tailscale. Используйте ws://<tailscale-ip>:5987 для защищённого зашифрованного подключения из любой точки."','"Tailscale Detected"':'"Tailscale обнаружен"','"Your Tailscale IP"':'"Ваш IP Tailscale"','"Use"':'"Использовать"','"Encrypted"':'"Зашифровано"',
            '"${(if (prompt.editable) edited[i] else variant.text).length} chars"':'"${(if (prompt.editable) edited[i] else variant.text).length} симв."',
            '"Screen Control" -> "Управление экраном"':'"Управление экраном" -> "Управление экраном"','"Device" -> "Устройство"':'"Устройство" -> "Устройство"','"Files" -> "Файлы"':'"Файлы" -> "Файлы"','"Camera" -> "Камера"':'"Камера" -> "Камера"','"Communication" -> "Связь"':'"Связь" -> "Связь"','"Notifications" -> "Уведомления"':'"Уведомления" -> "Уведомления"','"Media" -> "Мультимедиа"':'"Мультимедиа" -> "Мультимедиа"','"Storage" -> "Хранилище"':'"Хранилище" -> "Хранилище"','"Apps" -> "Приложения"':'"Приложения" -> "Приложения"','"System" -> "Система"':'"Система" -> "Система"','"Overlays" -> "Наложения"':'"Наложения" -> "Наложения"','"Alarms" -> "Будильники"':'"Будильники" -> "Будильники"',
            'text = category,':'text = category,','"${categoryTools.size} tools"':'"${categoryTools.size} инструментов"',
            'text = "Step ${(guidedFlow.stepsDone + 1).coerceAtMost(guidedFlow.stepsTotal)} of ${guidedFlow.stepsTotal} — $label"':'text = "Шаг ${(guidedFlow.stepsDone + 1).coerceAtMost(guidedFlow.stepsTotal)} из ${guidedFlow.stepsTotal} — $label"',
          }
          files=list(Path('apps/android/app/src/main/java/com/aster/ui').rglob('*.kt'))
          for p in files:
            s=p.read_text(encoding='utf-8'); old=s
            for a,b in repl.items(): s=s.replace(a,b)
            if s!=old: p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/russian-ui-autofix-3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/app/src/main/java/com/aster/ui .github/workflows/russian-ui-autofix-3.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: finish Russian localization of remote UI'
          git push
