name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and unique release tag
        id: check
        shell: bash
        run: |
          CURRENT=$(grep 'versionCode' apps/android/app/build.gradle.kts | grep -oP '\d+')
          VERSION_NAME=$(grep 'versionName' apps/android/app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          BASE_TAG="v${VERSION_NAME}"
          RELEASE_TAG="$BASE_TAG"

          if git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
            RELEASE_TAG="${BASE_TAG}-build.${GITHUB_RUN_NUMBER}"
          fi

          echo "versionCode: $CURRENT"
          echo "versionName: $VERSION_NAME"
          echo "releaseTag: $RELEASE_TAG"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: check-version
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.check-version.outputs.version_name }}
      VERSION_CODE: ${{ needs.check-version.outputs.version_code }}
      RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Localize permission UI for release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'apps/android/app/src/main/java/com/aster/ui/screens/permissions/PermissionsScreen.kt': {
              '"Permissions"': '"Разрешения"',
              '"All Granted"': '"Все предоставлены"',
              '"Continue in Settings…"': '"Продолжить в настройках…"',
              '"Ask all together"': '"Запросить все вместе"',
              '"Runtime Permissions"': '"Основные разрешения"',
              '"Notifications"': '"Уведомления"',
              '"Location"': '"Местоположение"',
              '"Phone & SMS"': '"Телефон и SMS"',
              '"Contacts"': '"Контакты"',
              '"Camera"': '"Камера"',
              '"Special Access"': '"Специальный доступ"',
              '"All Files Access"': '"Доступ ко всем файлам"',
              '"Storage"': '"Хранилище"',
              '"Accessibility Service"': '"Служба специальных возможностей"',
              '"Notification Listener"': '"Доступ к уведомлениям"',
              '"Display Over Apps"': '"Отображение поверх других приложений"',
              '"Battery Optimization"': '"Оптимизация батареи"',
            },
            'apps/android/app/src/main/java/com/aster/ui/InteractivePromptActivity.kt': {
              '"Choose a draft to publish"': '"Выберите вариант для публикации"',
              '"OPTION ${i + 1}"': '"ВАРИАНТ ${i + 1}"',
              '"${(if (prompt.editable) edited[i] else variant.text).length} chars"': '"${(if (prompt.editable) edited[i] else variant.text).length} символов"',
              '"Use this  ›"': '"Использовать ›"',
              '"Tap a draft to edit"': '"Нажмите на вариант, чтобы изменить его"',
              '"Pick a draft"': '"Выберите вариант"',
              '"Reject"': '"Отклонить"',
            },
          }
          for name, mapping in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore apps/android/aster-release.jks \
            -alias aster-ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-temporary-password \
            -keypass ci-temporary-password \
            -dname "CN=Svetlana CI, OU=Build, O=Mir Samozanyatykh, L=CI, ST=CI, C=XX"

      - name: Build release APK
        working-directory: apps/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/apps/android/aster-release.jks
          KEYSTORE_PASSWORD: ci-temporary-password
          KEY_ALIAS: aster-ci
          KEY_PASSWORD: ci-temporary-password
        run: ./gradlew assembleRelease

      - name: Verify APK exists
        run: |
          test -s apps/android/app/build/outputs/apk/release/app-release.apk
          sha256sum apps/android/app/build/outputs/apk/release/app-release.apk
          stat -c 'APK_SIZE_BYTES=%s' apps/android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Светлана v${{ env.VERSION_NAME }} (${{ env.RELEASE_TAG }})
          files: apps/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}