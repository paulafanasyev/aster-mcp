name: Apply Russian UI patch
on:
  push:
    branches: [fix/russian-ui-final]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PR #4 patch
        shell: bash
        run: |
          set -e
          curl -L --fail --silent --show-error https://github.com/paulafanasyev/aster-mcp/pull/4.patch -o /tmp/russian.patch
          git apply --3way /tmp/russian.patch
          git checkout origin/main -- .github/workflows
          git rm -f --ignore-unmatch LOCALIZATION_AUDIT.md PR_NOTES.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: apply complete Russian UI localization'
          git push
